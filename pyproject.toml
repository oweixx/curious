[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "curious-flame-uv"
version = "0.1.0"
description = "A small, explicit FLAME UV-map learning experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "torch==2.6.0",
  "matplotlib==3.10.3",
  "pillow==11.2.1",
  "plotly==6.1.2",
]

[project.scripts]
flame-uv = "flame_uv.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/flame_uv"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
